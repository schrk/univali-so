<svg viewBox="0 0 760 370" role="img" aria-label="Throughput por número de threads: com 100% de leitura o sistema escala de 4.505 para 17.968 requisições por segundo entre 1 e 8 threads, estabilizando em 4 núcleos; com 70% de leitura vai de 4.517 a 6.840; só com escrita fica plano em torno de 4.000." xmlns="http://www.w3.org/2000/svg"><style>
:root{--surface:#ffffff;--surface-2:#f7f9fb;--ink:#16202b;--ink-2:#495a6b;--ink-3:#75858f;
--line:#d4dce4;--line-strong:#b4c1cd;--flow:#0f766e;--flow-bg:#e6f1f0;--crit:#a8531a;--crit-bg:#fbf0e6;}

text{font-family:"IBM Plex Sans",Arial,sans-serif}
.lane-frame { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.bx { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.bx-in { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.bx-crit { fill: var(--crit-bg); stroke: var(--crit); stroke-width: 1.3; }
.slot-full { fill: var(--flow-bg); stroke: var(--flow); stroke-width: 1; }
.slot-free { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2, 2; }
.lane-hd { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: 0.13em; fill: var(--ink-2); }
.t { font-family: var(--sans); font-size: 11px; fill: var(--ink); }
.t2 { font-family: var(--sans); font-size: 10px; fill: var(--ink-2); }
.m { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.m2 { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.cap { font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; fill: var(--ink-3); }
.cap-crit { font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; fill: var(--crit); }
.ar { stroke: var(--flow); stroke-width: 1.5; fill: none; }
.ar-w { stroke: var(--crit); stroke-width: 1.5; fill: none; }
.ar-r { stroke: var(--flow); stroke-width: 1.5; fill: none; stroke-dasharray: 5, 3; }
.alab { font-family: var(--mono); font-size: 9.5px; fill: var(--flow); }
.alab-w { font-family: var(--mono); font-size: 9.5px; fill: var(--crit); }
.num { fill: var(--surface); stroke: var(--flow); stroke-width: 1.2; }
.num-w { fill: var(--surface); stroke: var(--crit); stroke-width: 1.2; }
.numt { font-family: var(--sans); font-size: 9.5px; font-weight: 600; fill: var(--flow); }
.numt-w { font-family: var(--sans); font-size: 9.5px; font-weight: 600; fill: var(--crit); }
.axis { stroke: var(--line-strong); stroke-width: 1; }
.guide { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 3, 3; }
.bar-r { fill: var(--flow-bg); stroke: var(--flow); stroke-width: 1; }
.bar-w { fill: var(--crit-bg); stroke: var(--crit); stroke-width: 1.2; }
.bar-wait { fill: none; stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3, 3; }</style>

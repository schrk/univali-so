<svg viewBox="0 0 1000 250" role="img" aria-label="Linha de tempo com quatro threads: três SELECT sobrepostos executando em paralelo, um UPDATE que espera os leitores saírem e obtém acesso exclusivo, e novos SELECT que só começam depois que o escritor libera o lock." xmlns="http://www.w3.org/2000/svg"><style>
:root{--surface:#ffffff;--surface-2:#f7f9fb;--ink:#16202b;--ink-2:#495a6b;--ink-3:#75858f;
--line:#d4dce4;--line-strong:#b4c1cd;--flow:#0f766e;--flow-bg:#e6f1f0;--crit:#a8531a;--crit-bg:#fbf0e6;}

text{font-family:"IBM Plex Sans",Arial,sans-serif}
.lane-frame { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.bx { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.bx-in { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.bx-crit { fill: var(--crit-bg); stroke: var(--crit); stroke-width: 1.3; }
.slot-full { fill: var(--flow-bg); stroke: var(--flow); stroke-width: 1; }
.slot-free { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2, 2; }
.lane-hd { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: 0.13em; fill: var(--ink-2); }
.t { font-family: var(--sans); font-size: 11px; fill: var(--ink); }
.t2 { font-family: var(--sans); font-size: 10px; fill: var(--ink-2); }
.m { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.m2 { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.cap { font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; fill: var(--ink-3); }
.cap-crit { font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; fill: var(--crit); }
.ar { stroke: var(--flow); stroke-width: 1.5; fill: none; }
.ar-w { stroke: var(--crit); stroke-width: 1.5; fill: none; }
.ar-r { stroke: var(--flow); stroke-width: 1.5; fill: none; stroke-dasharray: 5, 3; }
.alab { font-family: var(--mono); font-size: 9.5px; fill: var(--flow); }
.alab-w { font-family: var(--mono); font-size: 9.5px; fill: var(--crit); }
.num { fill: var(--surface); stroke: var(--flow); stroke-width: 1.2; }
.num-w { fill: var(--surface); stroke: var(--crit); stroke-width: 1.2; }
.numt { font-family: var(--sans); font-size: 9.5px; font-weight: 600; fill: var(--flow); }
.numt-w { font-family: var(--sans); font-size: 9.5px; font-weight: 600; fill: var(--crit); }
.axis { stroke: var(--line-strong); stroke-width: 1; }
.guide { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 3, 3; }
.bar-r { fill: var(--flow-bg); stroke: var(--flow); stroke-width: 1; }
.bar-w { fill: var(--crit-bg); stroke: var(--crit); stroke-width: 1.2; }
.bar-wait { fill: none; stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3, 3; }</style>
          <text class="m" x="106" y="52" text-anchor="end">W0</text>
          <text class="m" x="106" y="90" text-anchor="end">W1</text>
          <text class="m" x="106" y="128" text-anchor="end">W2</text>
          <text class="m" x="106" y="166" text-anchor="end">W3</text>

          <rect class="bar-r" x="120" y="32" width="315" height="26" rx="3"></rect>
          <text class="t" x="132" y="49">SELECT id=5</text>
          <rect class="bar-r" x="624" y="32" width="147" height="26" rx="3"></rect>
          <text class="t" x="636" y="49">SELECT id=7</text>

          <rect class="bar-r" x="162" y="70" width="294" height="26" rx="3"></rect>
          <text class="t" x="174" y="87">SELECT id=9</text>
          <rect class="bar-r" x="624" y="70" width="168" height="26" rx="3"></rect>
          <text class="t" x="636" y="87">SELECT id=5 (valor novo)</text>

          <rect class="bar-r" x="215" y="108" width="262" height="26" rx="3"></rect>
          <text class="t" x="227" y="125">SELECT id=2</text>

          <rect class="bar-wait" x="246" y="146" width="231" height="26" rx="3"></rect>
          <text class="t2" x="258" y="163">espera os leitores saírem</text>
          <rect class="bar-w" x="477" y="146" width="136" height="26" rx="3"></rect>
          <text class="t" x="489" y="163">UPDATE id=5</text>

          <line class="guide" x1="477" y1="26" x2="477" y2="196"></line>
          <line class="guide" x1="613" y1="26" x2="613" y2="196"></line>
          <text class="cap-crit" x="477" y="20" text-anchor="middle">ÚLTIMO LEITOR SAI</text>
          <text class="cap-crit" x="613" y="20" text-anchor="middle">ESCRITOR LIBERA</text>

          <line class="axis" x1="120" y1="196" x2="960" y2="196" marker-end="url(#ah2)"></line>
          <defs>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--line-strong)"></path>
            </marker>
          </defs>
          <text class="m2" x="120" y="214">t</text>
          <text class="t2" x="298" y="228" text-anchor="middle">3 leitores concorrentes</text>
          <text class="t2" x="545" y="228" text-anchor="middle">escrita exclusiva</text>
          <text class="t2" x="700" y="228" text-anchor="middle">leitores voltam a rodar juntos</text>
        </svg>
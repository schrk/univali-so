<svg viewBox="0 0 700 660" role="img" aria-label="Fluxo vertical: o cliente monta a requisição, escreve na memória compartilhada protegida por três semáforos, o servidor com quatro threads retira a requisição, executa na tabela de dados dentro da seção crítica protegida por mutex, e grava o resultado no log e no banco.txt." xmlns="http://www.w3.org/2000/svg"><style>
:root{--surface:#ffffff;--surface-2:#f7f9fb;--ink:#16202b;--ink-2:#495a6b;--ink-3:#75858f;
--line:#d4dce4;--line-strong:#b4c1cd;--flow:#0f766e;--flow-bg:#e6f1f0;--crit:#a8531a;--crit-bg:#fbf0e6;}

text{font-family:"IBM Plex Sans",Arial,sans-serif}
.bx { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.bx-in { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.bx-crit { fill: var(--crit-bg); stroke: var(--crit); stroke-width: 1.4; }
.slot { fill: var(--flow-bg); stroke: var(--flow); stroke-width: 1; }
.slot-vazio { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2, 2; }
.t { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
.t2 { font-family: var(--sans); font-size: 10.5px; fill: var(--ink-2); }
.m { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.m2 { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.cap { font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; fill: var(--ink-3); }
.cap-crit { font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; fill: var(--crit); }
.ar { stroke: var(--flow); stroke-width: 1.6; fill: none; }
.alab { font-family: var(--mono); font-size: 10px; fill: var(--flow); }
.zona { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3, 3; fill: none; }</style>
          <defs>
            <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"></path>
            </marker>
          </defs>

          <!-- zonas -->
          <rect class="zona" x="14" y="26" width="672" height="98" rx="5"></rect>
          <text class="cap" x="24" y="44">PROCESSO 1</text>
          <rect class="zona" x="14" y="160" width="672" height="140" rx="5"></rect>
          <text class="cap" x="24" y="178">SISTEMA OPERACIONAL</text>
          <rect class="zona" x="14" y="336" width="672" height="308" rx="5"></rect>
          <text class="cap" x="24" y="354">PROCESSO 2</text>

          <!-- 1. cliente -->
          <rect class="bx" x="200" y="52" width="300" height="60" rx="4"></rect>
          <text class="t" x="350" y="76" text-anchor="middle">Cliente monta a requisição</text>
          <text class="m2" x="350" y="95" text-anchor="middle">cliente.c</text>
          <text class="m2" x="686" y="80" text-anchor="end">Requisicao { op, id, nome }</text>

          <line class="ar" x1="350" y1="112" x2="350" y2="184" marker-end="url(#seta)"></line>
          <text class="alab" x="360" y="153">sem_post(cheias)</text>

          <!-- 2. memória compartilhada -->
          <rect class="bx" x="140" y="186" width="420" height="100" rx="4"></rect>
          <text class="t" x="350" y="208" text-anchor="middle">Memória compartilhada</text>
          <text class="m2" x="350" y="224" text-anchor="middle">/banco_memoria — shm_open + mmap</text>
          <rect class="slot" x="168" y="234" width="42" height="22" rx="2"></rect>
          <rect class="slot" x="214" y="234" width="42" height="22" rx="2"></rect>
          <rect class="slot-vazio" x="260" y="234" width="42" height="22" rx="2"></rect>
          <rect class="slot-vazio" x="306" y="234" width="42" height="22" rx="2"></rect>
          <rect class="slot-vazio" x="352" y="234" width="42" height="22" rx="2"></rect>
          <rect class="slot-vazio" x="398" y="234" width="42" height="22" rx="2"></rect>
          <text class="m2" x="450" y="249">buffer circular</text>
          <text class="m2" x="168" y="274">semáforos: vazias · cheias · mutex</text>
          <text class="m2" x="686" y="228" text-anchor="end">cliente escreve</text>
          <text class="m2" x="686" y="244" text-anchor="end">servidor lê</text>

          <line class="ar" x1="350" y1="286" x2="350" y2="360" marker-end="url(#seta)"></line>
          <text class="alab" x="360" y="328">sem_wait(cheias)</text>

          <!-- 3. servidor / threads -->
          <rect class="bx" x="140" y="362" width="420" height="92" rx="4"></rect>
          <text class="t" x="350" y="384" text-anchor="middle">Servidor — pool de 4 threads</text>
          <text class="m2" x="350" y="400" text-anchor="middle">servidor.c — pthread_create</text>
          <rect class="bx-in" x="160" y="410" width="90" height="30" rx="3"></rect>
          <text class="m" x="205" y="430" text-anchor="middle">thread 0</text>
          <rect class="bx-in" x="258" y="410" width="90" height="30" rx="3"></rect>
          <text class="m" x="303" y="430" text-anchor="middle">thread 1</text>
          <rect class="bx-in" x="356" y="410" width="90" height="30" rx="3"></rect>
          <text class="m" x="401" y="430" text-anchor="middle">thread 2</text>
          <rect class="bx-in" x="454" y="410" width="90" height="30" rx="3"></rect>
          <text class="m" x="499" y="430" text-anchor="middle">thread 3</text>
          <text class="m2" x="686" y="430" text-anchor="end">mesma função</text>

          <line class="ar" x1="350" y1="454" x2="350" y2="500" marker-end="url(#seta)"></line>
          <text class="alab" x="360" y="480">pthread_mutex_lock</text>

          <!-- 4. tabela (seção crítica) -->
          <rect class="bx-crit" x="140" y="502" width="420" height="72" rx="4"></rect>
          <text class="cap-crit" x="350" y="521" text-anchor="middle">SEÇÃO CRÍTICA — UMA THREAD POR VEZ</text>
          <text class="t" x="350" y="541" text-anchor="middle">Tabela de dados</text>
          <text class="m2" x="350" y="559" text-anchor="middle">Registro tabela[100] — INSERT · SELECT · UPDATE · DELETE</text>
          <text class="m2" x="686" y="545" text-anchor="end">protegida por mutex</text>

          <line class="ar" x1="350" y1="574" x2="350" y2="600" marker-end="url(#seta)"></line>

          <!-- 5. log -->
          <rect class="bx" x="200" y="602" width="300" height="34" rx="4"></rect>
          <text class="m" x="350" y="624" text-anchor="middle">log.txt · banco.txt</text>
          <text class="m2" x="686" y="624" text-anchor="end">resultado de cada requisição</text>
        </svg>